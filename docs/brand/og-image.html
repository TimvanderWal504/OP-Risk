<!doctype html><html><head><style>
@font-face{font-family:Brand;src:url("../../frontend/src/styles/assets/fonts/brand-font.ttf")}
@font-face{font-family:Body;src:url("../../frontend/src/styles/assets/fonts/body-font.otf")}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#080c14}
.bg{position:absolute;inset:0;background:url("../../frontend/src/styles/assets/lobby-battlefield.webp") center/cover}
.scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,12,20,.97) 0%,rgba(8,12,20,.93) 38%,rgba(8,12,20,.55) 62%,rgba(8,12,20,.25) 100%)}
.text{position:absolute;left:110px;top:50%;transform:translateY(-50%);color:#eef2f8;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.kicker{font:700 22px Body;letter-spacing:.08em;color:#c2cddd;text-transform:uppercase}
h1{font:800 104px/1.0 Brand;letter-spacing:-.02em;margin:14px 0 26px}
.bar{width:128px;height:10px;background:#a1c23a;border-radius:2px}
p{font:400 32px/1.35 Body;color:color-mix(in srgb,#eef2f8 90%,transparent);margin:28px 0 0}
.phone{position:absolute;right:120px;top:100px;width:240px;height:430px;border-radius:38px;padding:7px;box-sizing:border-box;
 background:#080c14;border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 18px 40px rgba(0,0,0,.55)}
.screen{position:relative;width:100%;height:100%;border-radius:31px;overflow:hidden;
 background:url("../../frontend/src/styles/assets/phone-battlefield.webp") center/cover;display:flex;align-items:center;justify-content:center}
.screen::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,12,20,.35),rgba(8,12,20,.15) 40%,rgba(8,12,20,.45))}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:64px;height:16px;border-radius:8px;background:#080c14;z-index:2}
.panel{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 14px 12px;border-radius:14px;
 background:rgba(20,29,44,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
 border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.16);text-shadow:0 2px 6px rgba(0,0,0,.85);text-align:center}
.label{font:800 9px Body;letter-spacing:.1em;text-transform:uppercase;color:color-mix(in srgb,#eef2f8 75%,transparent)}
.dice{display:flex;gap:7px}
.die{position:relative;width:44px;height:44px;border-radius:10px;padding:6px;box-sizing:border-box;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);gap:2px;
 background:linear-gradient(135deg,rgba(99,48,166,.45),rgba(99,48,166,.28));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
 border:1px solid color-mix(in srgb,#6a00f4 60%,transparent);
 box-shadow:inset 1px 1px 0 rgba(255,255,255,.45),inset -1px -1px 0 rgba(0,0,0,.25),inset 0 3px 0 rgba(255,255,255,.18),0 8px 20px -6px rgba(0,0,0,.45);
 transform:perspective(400px) rotateX(5deg)}
.die::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,.08) 20%,rgba(255,255,255,0) 40%)}
.die span{display:flex;align-items:center;justify-content:center}
.die i{width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.95),rgba(255,255,255,.7)),#eef2f8;
 box-shadow:inset 0 -1px 2px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.3),0 0 4px rgba(106,0,244,.6)}
.result{font:900 17px Brand;color:#eef2f8;white-space:nowrap}
.hint{font:400 10px Body;color:color-mix(in srgb,#eef2f8 75%,transparent)}
</style></head><body>
<div class="bg"></div><div class="scrim"></div>
<div class="text"><div class="kicker">Campagne-terminal</div><h1>OPERATIE<br>ATLAS</h1><div class="bar"></div>
<p>Het speelbord op de tv,<br>je legers op je telefoon.</p></div>
<div class="phone"><div class="screen"><div class="notch"></div><div class="panel"><div class="label">Uitkomst</div><div class="dice"><div class="die"><span><i></i></span><span></span><span><i></i></span><span><i></i></span><span></span><span><i></i></span><span><i></i></span><span></span><span><i></i></span></div><div class="die"><span><i></i></span><span></span><span><i></i></span><span></span><span><i></i></span><span></span><span><i></i></span><span></span><span><i></i></span></div><div class="die"><span><i></i></span><span></span><span></span><span></span><span><i></i></span><span></span><span></span><span></span><span><i></i></span></div></div><div class="result">Jij verslaat 2 legers</div><div class="hint">Details op de TV</div></div></div></div>
</body></html>
