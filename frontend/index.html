<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Operatie Atlas</title>
    <meta
      name="description"
      content="Operatie Atlas — Risk voor de hele kamer: het speelbord op de tv, je eigen legers op je telefoon."
    />

    <!-- Browser-chrome (adresbalk, statusbalk, taakwisselaar) in field-ink-950 (--bg),
         zodat er op telefoon en tv geen lichte rand om het donkere canvas valt. -->
    <meta name="theme-color" content="#080c14" />
    <meta name="color-scheme" content="dark" />

    <!-- Toevoegen aan beginscherm: openen zonder browserbalken -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Operatie Atlas" />
    <!-- Getallen (legers, spelcodes) niet als telefoonnummer auto-linken -->
    <meta name="format-detection" content="telephone=no" />

    <!-- Linkvoorbeeld wanneer de speel-link gedeeld wordt (WhatsApp, Signal, ...) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Operatie Atlas" />
    <meta property="og:title" content="Operatie Atlas" />
    <meta
      property="og:description"
      content="Risk voor de hele kamer: het speelbord op de tv, je eigen legers op je telefoon."
    />
    <meta property="og:locale" content="nl_NL" />
    <!-- og:image moet een absolute URL zijn; bron: docs/brand/og-image.html -->
    <meta property="og:image" content="https://op-risk-kappa.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Operatie Atlas — het speelbord op de tv, je legers op je telefoon" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Bron van de iconen: docs/brand/*.svg -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- colors_and_type.css laadt de webfonts via @import; vroeg verbinden scheelt
         een round-trip voordat de tekst in het juiste font staat. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
