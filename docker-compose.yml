# Lokale Postgres voor ontwikkeling (docs/azure-hosting-deployment.md: productie draait
# op Neon, niet op deze compose-opstelling).
#
# Postgres is hier bewust NIET via `ports:` bereikbaar op de host zelf: hij hangt alleen
# aan het interne compose-netwerk. Voor toegang vanaf de dev-machine (`dotnet test`) zie
# docker-compose.dev.yml.

services:
  db:
    image: postgres:17-alpine
    container_name: riskgame-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - riskgame-db-data:/var/lib/postgresql/data
    healthcheck:
      # Zorgt dat de API-service straks met `depends_on: condition:
      # service_healthy` kan wachten tot Marten daadwerkelijk kan verbinden.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - riskgame

volumes:
  riskgame-db-data:

networks:
  riskgame:
