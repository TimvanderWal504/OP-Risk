# Alleen voor lokale ontwikkeling — expliciet meegeven:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Publiceert Postgres op 127.0.0.1 zodat `dotnet test` op de dev-machine erbij kan.
# Bewust géén 0.0.0.0-binding. Deze file heet niet `override` omdat compose een
# override-bestand automatisch meeneemt.

services:
  db:
    ports:
      - "127.0.0.1:5433:5432"
